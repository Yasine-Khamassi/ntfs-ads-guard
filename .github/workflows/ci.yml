name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  collector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: cmake -S collector -B build/collector -A x64
      - run: cmake --build build/collector --config Release
      - run: pwsh -File collector/tests/config_validation.ps1 -Exe build/collector/Release/ads-guard-collector.exe -ValidConfig config/rules.json

  driver:
    # Compiles and packages the minifilter with the runner's WDK.
    # This checks that the code builds; it does not load or exercise it.
    # The WDK comes from NuGet (driver/packages.config), as in Microsoft's
    # driver samples CI.
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: nuget restore driver/packages.config -PackagesDirectory driver/packages
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild driver/AdsGuard.vcxproj /p:Configuration=Release /p:Platform=x64 /m /nologo
