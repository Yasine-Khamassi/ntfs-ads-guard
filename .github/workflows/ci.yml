name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  collector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: cmake -S collector -B build/collector -A x64
      - run: cmake --build build/collector --config Release
      - run: ctest --test-dir build/collector -C Release --output-on-failure
      - run: pwsh -File collector/tests/config_validation.ps1 -Exe build/collector/Release/ads-guard-collector.exe -ValidConfig config/rules.json
      - run: pwsh -File collector/tests/scan_test.ps1 -Exe build/collector/Release/ads-guard-collector.exe -Config config/rules.json

  driver:
    # Compiles and packages the minifilter against the WDK NuGet packages
    # (driver/packages.config), as Microsoft's driver samples CI does.
    # This proves the code builds. It does not load or exercise the driver.
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build AdsGuard.sys
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore driver/packages.config -PackagesDirectory driver/packages
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          msbuild driver/AdsGuard.vcxproj -p:Configuration=Release -p:Platform=x64 -nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Code Analysis (/analyze, warnings are errors)
        # Static Driver Verifier is not shipped in WDKs after build 26017, so
        # it cannot run against the WDK used here. This is the MSBuild
        # equivalent of Driver > Code Analysis in Visual Studio: the compiler
        # runs with /analyze and the WDK driver rule set, and any warning
        # fails the build.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $props = @('-p:Configuration=Release', '-p:Platform=x64', '-p:RunCodeAnalysis=true',
                     '-p:CodeAnalysisTreatWarningsAsErrors=true', '-p:SignMode=Off')
          Write-Host "Rule set: $(msbuild driver/AdsGuard.vcxproj @props -getProperty:CodeAnalysisRuleSet)"
          msbuild driver/AdsGuard.vcxproj @props -t:Rebuild -nologo -p:IntDir=$env:RUNNER_TEMP\ca\ -p:OutDir=$env:RUNNER_TEMP\ca\out\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
